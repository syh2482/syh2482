<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Bounce</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0f172a; /* Tailwind slate-900 */
            color: #f8fafc; /* Tailwind slate-50 */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none; /* 모바일에서 화면 스크롤 방지 */
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        canvas {
            background-color: #1e293b; /* Tailwind slate-800 */
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.2); /* 네온 느낌 그림자 */
            border-radius: 10px;
            max-width: 100%;
            max-height: 80vh; /* 컨트롤을 위한 공간 확보 */
            image-rendering: pixelated; /* 선명한 렌더링 */
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* UI 레이어 뒤의 캔버스 클릭 가능하게 */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .header {
            display: flex;
            justify-content: space-between;
            padding: 20px;
            font-size: 1.5rem;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.8);
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            z-index: 10;
        }
        .overlay-title {
            font-size: 4rem;
            font-weight: 900;
            margin-bottom: 2rem;
            color: #38bdf8;
            text-shadow: 0 0 20px #38bdf8, 0 0 40px #0284c7;
            text-align: center;
        }
        .btn {
            background: linear-gradient(135deg, #0ea5e9, #2563eb);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
            transition: transform 0.1s, box-shadow 0.1s;
            margin: 10px;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.6);
        }
        .btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 10px rgba(37, 99, 235, 0.4);
        }
        .hidden {
            display: none !important;
        }
        #mobile-controls {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 600px;
            padding: 20px;
            pointer-events: auto;
            margin-top: auto; /* 하단에 배치 */
        }
        .control-btn {
            width: 80px;
            height: 80px;
            background: rgba(56, 189, 248, 0.2);
            border: 2px solid rgba(56, 189, 248, 0.5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: rgba(255, 255, 255, 0.7);
            user-select: none;
            -webkit-user-select: none;
        }
        .control-btn:active {
            background: rgba(56, 189, 248, 0.4);
        }
        /* 데스크탑에서는 컨트롤 숨김 */
        @media (min-width: 768px) {
            #mobile-controls {
                display: none;
            }
            canvas {
                max-height: 90vh;
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <div id="ui-layer">
            <div class="header">
                <span id="stage-display">Stage 1</span>
                <span id="deaths-display">Deaths: 0</span>
            </div>
            
            <div id="mobile-controls">
                <div class="control-btn" id="btn-left">◀</div>
                <div class="control-btn" id="btn-right">▶</div>
            </div>
        </div>

        <!-- 메인 메뉴 -->
        <div id="main-menu" class="overlay">
            <div class="overlay-title">NEON<br>BOUNCE</div>
            <button class="btn" id="start-btn">Game Start</button>
            <p class="mt-4 text-slate-400">Press SPACE or Click Start</p>
        </div>

        <!-- 게임 오버 -->
        <div id="game-over" class="overlay hidden">
            <div class="overlay-title" style="color: #ef4444; text-shadow: 0 0 20px #ef4444, 0 0 40px #b91c1c;">GAME OVER</div>
            <button class="btn" id="retry-btn">Retry Stage</button>
            <p class="mt-4 text-slate-400">Press SPACE or Click Retry</p>
        </div>

        <!-- 스테이지 클리어 -->
        <div id="stage-clear" class="overlay hidden">
            <div class="overlay-title" style="color: #4ade80; text-shadow: 0 0 20px #4ade80, 0 0 40px #16a34a;">STAGE CLEAR!</div>
            <button class="btn" id="next-btn">Next Stage</button>
            <p class="mt-4 text-slate-400">Press SPACE or Click Next</p>
        </div>
        
        <!-- 올 클리어 -->
        <div id="all-clear" class="overlay hidden">
            <div class="overlay-title" style="color: #facc15; text-shadow: 0 0 20px #facc15, 0 0 40px #ca8a04;">ALL CLEAR!</div>
            <p id="final-stats" class="mb-6 text-2xl font-bold">Total Deaths: 0</p>
            <button class="btn" id="home-btn">Main Menu</button>
            <p class="mt-4 text-slate-400">Press SPACE or Click Menu</p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // UI 요소
        const uiStage = document.getElementById('stage-display');
        const uiDeaths = document.getElementById('deaths-display');
        const mainMenu = document.getElementById('main-menu');
        const gameOverScreen = document.getElementById('game-over');
        const stageClearScreen = document.getElementById('stage-clear');
        const allClearScreen = document.getElementById('all-clear');
        const finalStats = document.getElementById('final-stats');

        // 게임 설정 (파이썬 코드와 동일하게)
        const TILE_SIZE = 40; 
        const COLS = 20;
        const ROWS = 15;
        const GAME_WIDTH = COLS * TILE_SIZE; 
        const GAME_HEIGHT = ROWS * TILE_SIZE; 
        
        let scale = 1;

        // 색상 정의 (파이썬 코드 기반)
        const COLORS = {
            BG: '#0f172a',
            GRID: '#1e293b',
            PLAYER: '#38bdf8',
            PLAYER_GLOW: '#0284c7',
            BLOCK: 'rgba(148, 163, 184, 0.8)',
            BLOCK_BORDER: '#cbd5e1',
            SPIKE: '#ef4444',
            SPIKE_GLOW: '#b91c1c',
            GOAL: '#4ade80',
            GOAL_GLOW: '#16a34a'
        };

        // 게임 상태
        let gameState = 'menu'; // menu, playing, gameover, clear, allclear
        let currentStage = 0;
        let deaths = 0;
        let animationId;
        let lastTime = 0;
        
        // 입력 상태
        const keys = {
            ArrowLeft: false,
            ArrowRight: false,
            a: false,
            d: false
        };

        // 모바일 입력
        let touchLeft = false;
        let touchRight = false;

        class Player {
            constructor(x, y) {
                this.startX = x;
                this.startY = y;
                this.x = x;
                this.y = y;
                this.radius = TILE_SIZE * 0.35;
                this.vx = 0;
                this.vy = 0;
                // 플레이어가 더 부드럽고 정교하게 컨트롤 되도록 물리 엔진 수정
                this.speed = TILE_SIZE * 0.12; 
                this.gravity = TILE_SIZE * 0.015;
                this.bounceForce = -TILE_SIZE * 0.32;
            }

            reset() {
                this.x = this.startX;
                this.y = this.startY;
                this.vx = 0;
                this.vy = 0;
            }

            update() {
                // 좌우 이동
                let isMovingLeft = keys.ArrowLeft || keys.a || touchLeft;
                let isMovingRight = keys.ArrowRight || keys.d || touchRight;

                if (isMovingLeft) {
                    this.vx = -this.speed;
                } else if (isMovingRight) {
                    this.vx = this.speed;
                } else {
                    this.vx = 0;
                }

                // 중력 적용
                this.vy += this.gravity;
                
                // 최고 낙하 속도 제한
                if(this.vy > TILE_SIZE * 0.4) {
                    this.vy = TILE_SIZE * 0.4;
                }

                this.x += this.vx;
                this.y += this.vy;

                // 화면 밖으로 떨어지면 사망
                if (this.y - this.radius > GAME_HEIGHT) {
                    die();
                }
            }

            draw(ctx) {
                // 네온 효과 (바깥쪽 흐릿한 원)
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius * 1.3, 0, Math.PI * 2);
                ctx.fillStyle = COLORS.PLAYER_GLOW;
                ctx.globalAlpha = 0.5; // 글로우 투명도
                ctx.fill();
                ctx.globalAlpha = 1.0;

                // 본체
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = COLORS.PLAYER;
                ctx.fill();
                
                // 하이라이트 효과
                ctx.beginPath();
                ctx.arc(this.x - this.radius*0.3, this.y - this.radius*0.3, this.radius*0.2, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,255,255,0.5)';
                ctx.fill();
            }
        }

        const BLOCK_TYPES = {
            EMPTY: 0,
            NORMAL: 1, 
            SPIKE_UP: 2, 
            SPIKE_DOWN: 3, 
            SPIKE_LEFT: 4, 
            SPIKE_RIGHT: 5, 
            PLAYER_START: 8,
            GOAL: 9
        };

        class Block {
            constructor(x, y, type) {
                this.x = x * TILE_SIZE;
                this.y = y * TILE_SIZE;
                this.width = TILE_SIZE;
                this.height = TILE_SIZE;
                this.type = type;
            }

            draw(ctx, time) {
                switch (this.type) {
                    case BLOCK_TYPES.NORMAL:
                        // 블록 본체
                        ctx.fillStyle = '#64748b'; // 파이썬의 (100, 116, 139)와 유사
                        ctx.fillRect(this.x, this.y, this.width, this.height);
                        
                        // 네온 엣지
                        ctx.strokeStyle = COLORS.BLOCK_BORDER;
                        ctx.lineWidth = 2;
                        ctx.strokeRect(this.x, this.y, this.width, this.height);
                        
                        // 내부 사각형
                        ctx.strokeStyle = '#94a3b8';
                        ctx.lineWidth = 1;
                        ctx.strokeRect(this.x + 2, this.y + 2, this.width - 4, this.height - 4);
                        break;
                        
                    case BLOCK_TYPES.SPIKE_UP:
                    case BLOCK_TYPES.SPIKE_DOWN:
                    case BLOCK_TYPES.SPIKE_LEFT:
                    case BLOCK_TYPES.SPIKE_RIGHT:
                        this.drawSpike(ctx);
                        break;
                        
                    case BLOCK_TYPES.GOAL:
                        let cx = this.x + this.width/2;
                        let cy = this.y + this.height/2;
                        let r = this.width*0.4;
                        
                        // 네온 글로우
                        ctx.beginPath();
                        ctx.arc(cx, cy, r * 1.2, 0, Math.PI * 2);
                        ctx.fillStyle = COLORS.GOAL_GLOW;
                        ctx.globalAlpha = 0.5;
                        ctx.fill();
                        ctx.globalAlpha = 1.0;
                        
                        // 본체
                        ctx.beginPath();
                        ctx.arc(cx, cy, r, 0, Math.PI*2);
                        ctx.fillStyle = COLORS.GOAL;
                        ctx.fill();
                        ctx.strokeStyle = '#ffffff';
                        ctx.lineWidth = 2;
                        ctx.stroke();
                        
                        // 펄스 애니메이션 (시간 기반)
                        let pulseR = r * 0.5 + Math.sin(time * 0.005) * r * 0.2;
                        
                        ctx.beginPath();
                        ctx.arc(cx, cy, Math.max(0.1, pulseR), 0, Math.PI*2); // 반지름이 음수가 되지 않도록 보호
                        ctx.fillStyle = '#ffffff';
                        ctx.fill();
                        break;
                }
            }

            drawSpike(ctx) {
                let x = this.x;
                let y = this.y;
                let w = this.width;
                let h = this.height;
                
                ctx.beginPath();
                
                if (this.type === BLOCK_TYPES.SPIKE_UP) {
                    ctx.moveTo(x, y + h);
                    ctx.lineTo(x + w / 2, y);
                    ctx.lineTo(x + w, y + h);
                } else if (this.type === BLOCK_TYPES.SPIKE_DOWN) {
                    ctx.moveTo(x, y);
                    ctx.lineTo(x + w / 2, y + h);
                    ctx.lineTo(x + w, y);
                } else if (this.type === BLOCK_TYPES.SPIKE_LEFT) {
                    ctx.moveTo(x + w, y);
                    ctx.lineTo(x, y + h / 2);
                    ctx.lineTo(x + w, y + h);
                } else if (this.type === BLOCK_TYPES.SPIKE_RIGHT) {
                    ctx.moveTo(x, y);
                    ctx.lineTo(x + w, y + h / 2);
                    ctx.lineTo(x, y + h);
                }
                ctx.closePath();
                
                // 글로우 효과를 위해 두 번 그리기 (파이썬 코드 로직 반영)
                ctx.fillStyle = COLORS.SPIKE_GLOW;
                ctx.fill();
                
                ctx.fillStyle = COLORS.SPIKE;
                ctx.fill();
            }
        }

        function rectCircleColliding(circle, rect) {
            // 가장 가까운 점 찾기
            let closestX = Math.max(rect.x, Math.min(circle.x, rect.x + rect.width));
            let closestY = Math.max(rect.y, Math.min(circle.y, rect.y + rect.height));

            // 거리 계산
            let distanceX = circle.x - closestX;
            let distanceY = circle.y - closestY;

            // 피타고라스 정리로 반지름 이내인지 확인
            return (distanceX * distanceX + distanceY * distanceY) < (circle.radius * circle.radius);
        }

        // 스테이지 테마별 전면 개편 (물리 엔진에 맞춘 완벽한 클리어 동선)
        const stages = [
            // Stage 1: The Beginning (튜토리얼 - 단순 평지)
            [
                "00000000000000000000",
                "00000000000000000000",
                "00000000000000000000",
                "00000000000000000000",
                "00000000000000000000",
                "00000000000000000000",
                "00000000000000000000",
                "00000000000000000000",
                "00000000000000000000",
                "00000000000000000000",
                "00000000000000000000",
                "00800000000000000090",
                "11111111111111111111",
                "00000000000000000000",
                "00000000000000000000"
            ],
            // Stage 2: First Spikes (가시 점프)
            [
                "00000000000000000000",
                "00000000000000000000",
                "00000000000000000000",
                "00000000000000000000",
                "00000000000000000000",
                "00000000000000000000",
                "00000000000000000000",
                "00000000000000000000",
                "00000000000000000000",
                "00800000000000000090",
                "00000000000000000000",
                "11110001111000111111",
                "11112221111222111111",
                "11111111111111111111",
                "00000000000000000000"
            ],
            // Stage 3: Staircase (계단 오르기)
            [
                "00000000000000000000",
                "00000000000000000000",
                "00000000000000000000",
                "00000000000000000090",
                "00000000000000001111",
                "00000000000000000000",
                "00000000000011110000",
                "00000000000000000000",
                "00000000111100000000",
                "00000000000000000000",
                "00001111000000000000",
                "00800000000000000000",
                "11110000000000000000",
                "00000000000000000000",
                "00000000000000000000"
            ],
            // Stage 4: The Cave (낮은 천장)
            [
                "11111111111111111111",
                "11111111111111111111",
                "33333333333333333333",
                "00000000000000000000",
                "00000000000000000000",
                "00000000000000000000",
                "00800000000000000090",
                "00000012210002200000",
                "11111211111211111111",
                "11111111111111111111",
                "11111111111111111111",
                "00000000000000000000",
                "00000000000000000000",
                "00000000000000000000",
                "00000000000000000000"
            ],
            // Stage 5: Gap Jumps (징검다리)
            [
                "00000000000000000000",
                "00000000000000000000",
                "00000000000000000000",
                "00000000000000000000",
                "00000000000000000000",
                "00000000000000000000",
                "00000000000000000000",
                "00000000000000000000",
                "00000000000000000090",
                "00800000000000000111",
                "00000000000000000000",
                "01100011000110001100",
                "01100011000110001100",
                "01100011000110001100",
                "00000000000000000000"
            ],
            // Stage 6: The Wall (벽 넘기)
            [
                "00000000000000000000",
                "00000000000000000000",
                "00000000000000000000",
                "00000000000000000090",
                "00000000011100001111",
                "00001100001100000000",
                "00000000001100000000",
                "00800001101100000000",
                "00000000001100000000",
                "11111100001111111111",
                "11111122221111111111",
                "11111111111111111111",
                "00000000000000000000",
                "00000000000000000000",
                "00000000000000000000"
            ],
            // Stage 7: Tunnel of Doom (정밀한 가시 터널)
            [
                "00000000000000000000",
                "11111111111111111111",
                "11111111111111111111",
                "33333333333333333333",
                "00000333000333000000",
                "00000030000030000000",
                "00800000000000000090",
                "00000000000000000000",
                "11111111111111111111",
                "00000000000000000000",
                "00000000000000000000",
                "00000000000000000000",
                "00000000000000000000",
                "00000000000000000000",
                "00000000000000000000"
            ],
            // Stage 8: Leap of Faith (신뢰의 도약 - 하강)
            [
                "00800000000000000000",
                "11100000000000000000",
                "00000000000000000000",
                "00000400000000000000",
                "00000110000000000000",
                "00000000040000000000",
                "00000000011000000000",
                "00000000000004000000",
                "00000000000001100000",
                "00000000000000000000",
                "00000000000000000090",
                "00000000000000000111",
                "22222222222222222111",
                "11111111111111111111",
                "00000000000000000000"
            ],
            // Stage 9: Zig Zag Maze (지그재그 미로)
            [
                "00000000000000000000",
                "11111111111111110090",
                "00000000000000000111",
                "00000000000000000000",
                "00111111111111111111",
                "10000000000000000000",
                "00000000000000000000",
                "11111111111111111000",
                "00000000000000000100",
                "00000000000000000000",
                "00011111111111111111",
                "00800000000000000000",
                "11110000000000000000",
                "22222222222222222222",
                "11111111111111111111"
            ],
            // Stage 10: The Gauntlet (최종 관문)
            [
                "00000000000000000000",
                "00000000000000000090",
                "00000000000000000111",
                "00000000000002200000",
                "00000000000011110000",
                "00000000020000000000",
                "00000000110000000000",
                "00000200000000000000",
                "00001100000000000000",
                "00800000000000000000",
                "11110000000000000000",
                "22222222222222222222",
                "11111111111111111111",
                "00000000000000000000",
                "00000000000000000000"
            ]
        ];

        let player;
        let blocks = [];

        function resize() {
            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;
            
            const isMobile = windowWidth < 768;
            const availableHeight = isMobile ? windowHeight - 150 : windowHeight;

            const scaleX = windowWidth / GAME_WIDTH;
            const scaleY = availableHeight / GAME_HEIGHT;
            
            scale = Math.min(scaleX, scaleY) * 0.95; 
            
            canvas.width = GAME_WIDTH * scale;
            canvas.height = GAME_HEIGHT * scale;
            
            // 모든 렌더링을 스케일링된 컨텍스트에서 수행
            ctx.scale(scale, scale);
        }

        function loadStage(stageIndex) {
            blocks = [];
            player = null;
            
            const layout = stages[stageIndex];
            
            for (let y = 0; y < layout.length; y++) {
                for (let x = 0; x < layout[y].length; x++) {
                    const type = parseInt(layout[y][x]);
                    
                    if (type === BLOCK_TYPES.PLAYER_START) {
                        player = new Player(x * TILE_SIZE + TILE_SIZE/2, y * TILE_SIZE + TILE_SIZE/2);
                    } else if (type !== BLOCK_TYPES.EMPTY) {
                        blocks.push(new Block(x, y, type));
                    }
                }
            }
            
            uiStage.innerText = `Stage ${stageIndex + 1}`;
            uiDeaths.innerText = `Deaths: ${deaths}`;
        }

        function gameLoop(timestamp) {
            if (gameState !== 'playing') return;
            
            const time = timestamp || 0;

            // 1. 상태 업데이트
            player.update();

            // 파이썬 코드의 충돌 로직 적용
            let prevY = player.y - player.vy;
            let prevX = player.x - player.vx;

            for (let block of blocks) {
                if (rectCircleColliding(player, block)) {
                    
                    // 목표 지점 도달
                    if (block.type === BLOCK_TYPES.GOAL) {
                        clearStage();
                        return;
                    }
                    
                    // 가시 충돌
                    if (block.type >= 2 && block.type <= 5) {
                        die();
                        return;
                    }

                    // 일반 블록 바운스
                    if (block.type === BLOCK_TYPES.NORMAL) {
                        // 위에서 충돌
                        if (prevY + player.radius <= block.y + 5) {
                            player.y = block.y - player.radius;
                            player.vy = player.bounceForce;
                        }
                        // 아래에서 충돌
                        else if (prevY - player.radius >= block.y + block.height - 5) {
                            player.y = block.y + block.height + player.radius;
                            player.vy = 0;
                        }
                        // 측면 충돌
                        else {
                            if (prevX < block.x) {
                                player.x = block.x - player.radius;
                            } else if (prevX > block.x + block.width) {
                                player.x = block.x + block.width + player.radius;
                            }
                        }
                    }
                }
            }

            // 2. 화면 그리기
            // 배경 지우기
            ctx.fillStyle = COLORS.BG;
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
            
            // 격자 그리기
            ctx.strokeStyle = COLORS.GRID;
            ctx.lineWidth = 1;
            ctx.beginPath();
            for (let x = 0; x <= GAME_WIDTH; x += TILE_SIZE) {
                ctx.moveTo(x, 0);
                ctx.lineTo(x, GAME_HEIGHT);
            }
            for (let y = 0; y <= GAME_HEIGHT; y += TILE_SIZE) {
                ctx.moveTo(0, y);
                ctx.lineTo(GAME_WIDTH, y);
            }
            ctx.stroke();

            // 객체 그리기
            for (let block of blocks) {
                block.draw(ctx, time);
            }
            player.draw(ctx);

            animationId = requestAnimationFrame(gameLoop);
        }

        function startGame() {
            if(gameState === 'playing') return;
            gameState = 'playing';
            currentStage = 0;
            deaths = 0;
            hideAllMenus();
            
            loadStage(currentStage);
            animationId = requestAnimationFrame(gameLoop);
        }

        function die() {
            gameState = 'gameover';
            deaths++;
            uiDeaths.innerText = `Deaths: ${deaths}`;
            gameOverScreen.classList.remove('hidden');
            cancelAnimationFrame(animationId);
        }

        function retryStage() {
            if(gameState === 'playing') return;
            gameState = 'playing';
            hideAllMenus();
            player.reset();
            animationId = requestAnimationFrame(gameLoop);
        }

        function clearStage() {
            gameState = 'clear';
            cancelAnimationFrame(animationId);
            
            if (currentStage < stages.length - 1) {
                stageClearScreen.classList.remove('hidden');
            } else {
                gameState = 'allclear';
                finalStats.innerText = `Total Deaths: ${deaths}`;
                allClearScreen.classList.remove('hidden');
            }
        }

        function nextStage() {
            if(gameState === 'playing') return;
            currentStage++;
            gameState = 'playing';
            hideAllMenus();
            loadStage(currentStage);
            animationId = requestAnimationFrame(gameLoop);
        }
        
        function hideAllMenus() {
            mainMenu.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            stageClearScreen.classList.add('hidden');
            allClearScreen.classList.add('hidden');
        }

        window.addEventListener('resize', () => {
            resize();
            // 리사이즈 시 현재 화면 상태 유지하여 다시 그리기
            if(gameState === 'playing') {
                ctx.fillStyle = COLORS.BG;
                ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
                for (let block of blocks) block.draw(ctx, performance.now());
                if(player) player.draw(ctx);
            }
        });

        // 키보드 컨트롤 (스페이스바 게임 흐름 제어 포함)
        window.addEventListener('keydown', (e) => {
            if (keys.hasOwnProperty(e.key)) {
                keys[e.key] = true;
            }
            
            // 스페이스바로 상태 진행 (파이썬 로직)
            if (e.code === 'Space') {
                e.preventDefault(); // 스크롤 방지
                if (gameState === 'menu') {
                    startGame();
                } else if (gameState === 'gameover') {
                    retryStage();
                } else if (gameState === 'clear') {
                    nextStage();
                } else if (gameState === 'allclear') {
                    document.getElementById('home-btn').click();
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            if (keys.hasOwnProperty(e.key)) {
                keys[e.key] = false;
            }
        });

        // 모바일 터치 컨트롤
        const btnLeft = document.getElementById('btn-left');
        const btnRight = document.getElementById('btn-right');

        // 터치 및 마우스 이벤트 처리 헬퍼 함수
        const handleControlStart = (dir) => (e) => {
            e.preventDefault();
            if(dir === 'left') touchLeft = true;
            if(dir === 'right') touchRight = true;
        };
        const handleControlEnd = (dir) => (e) => {
            e.preventDefault();
            if(dir === 'left') touchLeft = false;
            if(dir === 'right') touchRight = false;
        };

        btnLeft.addEventListener('touchstart', handleControlStart('left'));
        btnRight.addEventListener('touchstart', handleControlStart('right'));
        btnLeft.addEventListener('touchend', handleControlEnd('left'));
        btnRight.addEventListener('touchend', handleControlEnd('right'));
        
        btnLeft.addEventListener('mousedown', handleControlStart('left'));
        btnLeft.addEventListener('mouseup', handleControlEnd('left'));
        btnLeft.addEventListener('mouseleave', handleControlEnd('left'));
        
        btnRight.addEventListener('mousedown', handleControlStart('right'));
        btnRight.addEventListener('mouseup', handleControlEnd('right'));
        btnRight.addEventListener('mouseleave', handleControlEnd('right'));

        // 버튼 클릭 이벤트
        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('retry-btn').addEventListener('click', retryStage);
        document.getElementById('next-btn').addEventListener('click', nextStage);
        document.getElementById('home-btn').addEventListener('click', () => {
            hideAllMenus();
            mainMenu.classList.remove('hidden');
            gameState = 'menu';
        });

        // 초기 화면 설정
        resize();
        
    </script>
</body>
</html>
